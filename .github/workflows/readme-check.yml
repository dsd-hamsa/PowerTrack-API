name: README is up to date

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate README
        run: npm run readme:gen

      - name: Ensure no diff
        run: |
          git status --porcelain
          git diff --exit-code README.md
